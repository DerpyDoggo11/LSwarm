
; External ESP32-S3 Super Mini (drone radio brain).
; Flash over the S3's own USB-C port (NOT through the RP2350 bridge anymore).

[env:drone_s3]
platform  = espressif32
board     = esp32-s3-devkitc-1     ; S3 Super Mini is compatible with this def
framework = arduino

board_build.flash_mode = dio
board_build.partitions = default.csv

; Super Mini exposes only USB-serial-jtag, so run the console over native USB.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DUSE_UWB=1                     ; drop this if no DW3000 add-on is fitted

lib_deps =
    https://github.com/Makerfabs/Makerfabs-ESP32-UWB-DW3000.git

monitor_speed = 115200
