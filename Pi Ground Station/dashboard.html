<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSwarm Live</title>
<link rel="stylesheet" href="/leaflet.css">
<script src="/leaflet.js"></script>
<style>
  :root { --bg:#0f1216; --panel:#171c22; --line:#2a323c; --fg:#e6edf3; --accent:#4aa3ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,sans-serif; color:var(--fg); background:var(--bg); display:flex; height:100vh; }
  #map { flex:1; }
  #side { width:360px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; overflow:auto; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:16px; }
  #link { font-size:12px; }
  #link .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--bad); margin-right:5px; }
  #link.up .dot { background:var(--ok); }
  section { padding:10px 12px; border-bottom:1px solid var(--line); }
  h2 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:#9aa7b4; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:4px 5px; border-bottom:1px solid var(--line); font-size:12px; white-space:nowrap; }
  .pill { padding:1px 6px; border-radius:10px; font-size:11px; font-weight:600; }
  .ok{background:#12351f;color:var(--ok)} .warn{background:#3a2d0c;color:var(--warn)} .bad{background:#3a1414;color:var(--bad)}
  .stale td { opacity:.4; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div id="map"></div>
<div id="side">
  <header>
    <h1>LSwarm live</h1>
    <span id="link"><span class="dot"></span>link <a href="/setup">setup →</a></span>
  </header>
  <section><h2>Drones</h2><table><thead><tr><th>id</th><th>x</th><th>y</th><th>z</th><th>q</th><th>vbat</th><th>arm</th><th>uwb</th><th>age</th></tr></thead><tbody id="drones"></tbody></table></section>
  <section><h2>Anchors</h2><table><thead><tr><th>id</th><th>lat</th><th>lon</th><th>z</th><th>uwb</th><th>vbat</th><th>age</th></tr></thead><tbody id="anchors"></tbody></table></section>
</div>
<script>
const map = L.map('map').setView([37.7749, -122.4194], 18);
L.tileLayer('/tiles/{z}/{x}/{y}', { maxZoom: 21 }).addTo(map);

const aMarkers = {}, dMarkers = {}, dTrail = {};
let centered = false;

function anchorIcon(id){ return L.divIcon({ className:'', html:
  `<div style="width:20px;height:20px;border-radius:4px;background:#ffcc33;border:2px solid #111;
   display:flex;align-items:center;justify-content:center;font:700 11px sans-serif;color:#111">${id}</div>`,
   iconSize:[20,20], iconAnchor:[10,10] }); }
function droneIcon(id, armed){ const c = armed? '#3fb950':'#4aa3ff'; return L.divIcon({ className:'', html:
  `<div style="width:16px;height:16px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 0 8px ${c}">
   </div><div style="font:700 11px sans-serif;color:#fff;text-shadow:0 0 3px #000;margin-top:-1px">${id}</div>`,
   iconSize:[16,28], iconAnchor:[8,8] }); }

function pill(v, good){ if(v==null) return '<span class="pill warn">?</span>';
  return `<span class="pill ${v==good?'ok':'bad'}">${v==good?'ok':'no'}</span>`; }
function vbatCls(v){ if(v==null) return 'warn'; return v<3.4?'bad':(v<3.6?'warn':'ok'); }
function ageStale(a){ return a==null || a>3; }

function renderAnchors(anchors){
  const tb = document.getElementById('anchors'); tb.innerHTML='';
  Object.keys(anchors).sort((a,b)=>a-b).forEach(id=>{
    const a = anchors[id];
    if(!aMarkers[id]) aMarkers[id] = L.marker([a.lat,a.lon],{icon:anchorIcon(id)}).addTo(map);
    else aMarkers[id].setLatLng([a.lat,a.lon]);
    const tr = document.createElement('tr'); if(ageStale(a.age)) tr.className='stale';
    tr.innerHTML = `<td>${id}</td><td>${a.lat.toFixed(6)}</td><td>${a.lon.toFixed(6)}</td>`+
      `<td>${(a.z??0).toFixed(1)}</td><td>${pill(a.uwbok,1)}</td>`+
      `<td class="pill ${vbatCls(a.vbat)}">${a.vbat!=null?a.vbat.toFixed(2):'—'}</td>`+
      `<td>${a.age!=null?a.age+'s':'—'}</td>`;
    tb.appendChild(tr);
  });
}

function renderDrones(drones){
  const tb = document.getElementById('drones'); tb.innerHTML='';
  Object.keys(drones).sort((a,b)=>a-b).forEach(id=>{
    const d = drones[id];
    if(d.lat!=null && d.lon!=null){
      if(!dMarkers[id]) dMarkers[id]=L.marker([d.lat,d.lon],{icon:droneIcon(id,d.armed)}).addTo(map);
      else { dMarkers[id].setLatLng([d.lat,d.lon]); dMarkers[id].setIcon(droneIcon(id,d.armed)); }
      if(!dTrail[id]) dTrail[id]=L.polyline([],{color:'#4aa3ff',weight:2,opacity:.6}).addTo(map);
      const pts=dTrail[id].getLatLngs(); pts.push([d.lat,d.lon]); if(pts.length>60)pts.shift(); dTrail[id].setLatLngs(pts);
      if(!centered){ map.setView([d.lat,d.lon],19); centered=true; }
    }
    const tr = document.createElement('tr'); if(ageStale(d.age)) tr.className='stale';
    const f=(v,n=2)=>v!=null?v.toFixed(n):'—';
    tr.innerHTML = `<td>${id}</td><td>${f(d.x)}</td><td>${f(d.y)}</td><td>${f(d.z)}</td><td>${d.q??'—'}</td>`+
      `<td class="pill ${vbatCls(d.vbat)}">${f(d.vbat)}</td><td>${pill(d.armed,1)}</td>`+
      `<td>${pill(d.uwbok,1)}</td><td>${d.age!=null?d.age+'s':'—'}</td>`;
    tb.appendChild(tr);
  });
}

// centre the map on the configured origin once at load
fetch('/config').then(r=>r.json()).then(c=>{
  if(c.geo && c.geo.origin_lat){ map.setView([c.geo.origin_lat,c.geo.origin_lon],19); centered=true; }
}).catch(()=>{});

const link = document.getElementById('link');
const es = new EventSource('/events');
es.onopen = ()=> link.classList.add('up');
es.onerror = ()=> link.classList.remove('up');
es.onmessage = ev => { const s = JSON.parse(ev.data); renderAnchors(s.anchors||{}); renderDrones(s.drones||{}); };
</script>
</body>
</html>
