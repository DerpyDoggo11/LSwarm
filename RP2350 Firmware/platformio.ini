; ===========================================================================
;  Drone flight controller - RP2350A + W25Q128 (16 MB) + ESP32-C3
;  Arduino core: earlephilhower arduino-pico
; ===========================================================================
; One-time setup:
;   VS Code -> PlatformIO Home -> Platforms -> Advanced Installation ->
;       https://github.com/maxgerhardt/platform-raspberrypi.git
;   (the built-in "raspberrypi" platform is Mbed-only and has no RP2350)
; ===========================================================================

[platformio]
default_envs = drone
boards_dir = boards

; ---------------------------------------------------------------------------
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rp2350
framework = arduino
board_build.core = earlephilhower

; 16 MB flash: 15 MB program + 1 MB LittleFS (logs / config)
board_build.filesystem_size = 1m

monitor_speed = 115200
; USB stack: "pico" = TinyUSB from the core, gives us Serial.dtr()/rts()
build_flags =
    -DUSB_MANUFACTURER='"LSwarm"'
    -DUSB_PRODUCT='"Mk.1"'
    -DPICO_XOSC_STARTUP_DELAY_MULTIPLIER=64   ; be nice to the 12 MHz xtal
    -O2

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

; ---------------------------------------------------------------------------
; Normal flight firmware
[env:drone]
build_flags = ${env.build_flags}

; ---------------------------------------------------------------------------
; Dedicated "USB <-> ESP32-C3" programmer firmware.
; Flash this to the RP2350 when you want to program the ESP32.
; (The normal firmware can also enter this mode at runtime - see README.)
[env:esp_passthrough]
build_flags = ${env.build_flags} -DESP_PASSTHROUGH_ONLY=1

; ---------------------------------------------------------------------------
; SWD debug via a second Pico running "debugprobe" (TP35/37/39/43/44 pads)
[env:drone_debug]
build_flags = ${env.build_flags} -DDEBUG_BUILD=1 -g -Og
build_type = debug
upload_protocol = cmsis-dap
debug_tool  = cmsis-dap